# See the pacman.conf(5) manpage for option and repository directives
# Surface Pro 11 (aarch64-surface): Arch Linux Ports, not Arch Linux ARM.
# [dwhinham] carries the Surface kernel (linux-sp11), firmware and audio packages.
# Edge channel alone, as on every aarch64 platform.

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here. Unlike the other
# platforms, Omarchy comes LAST: its aarch64 packages are built against Arch
# Linux ARM, whose Qt and libraries lag Arch Linux Ports, so a package both
# publish is taken from Ports, built against the libraries actually installed.
[dwhinham]
Server = https://github.com/dwhinham/archlinux-repo/releases/download/$arch

[forge]
Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[omarchy]
Server = https://pkgs.omarchy.org/edge/$arch
